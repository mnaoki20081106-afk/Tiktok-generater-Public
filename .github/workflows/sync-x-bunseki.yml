name: Sync X-Bunseki Submodule

on:
  push:
    branches: [main]
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-x-bunseki-submodule
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name != 'push' || github.actor != 'x-engine-sync[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
      ADMIN_EMAILS: ci@example.com
      IP_HASH_SECRET: ci-only-secret-0123456789abcdef0123456789
      NEXT_PUBLIC_SITE_URL: https://example.com
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Detect meaningful X-Bunseki changes
        id: engine
        shell: bash
        run: |
          set -euo pipefail
          current="$(git -C X-Bunseki rev-parse HEAD)"
          git -C X-Bunseki fetch --quiet origin main
          latest="$(git -C X-Bunseki rev-parse origin/main)"

          echo "current=$current"
          echo "latest=$latest"

          if [ "$current" = "$latest" ]; then
            echo "update=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed="$(git -C X-Bunseki diff --name-only "$current" "$latest" || true)"
          printf '%s\n' "$changed"

          meaningful="$(printf '%s\n' "$changed" | node scripts/x-submodule-change-filter.mjs)"
          if [ -z "$meaningful" ]; then
            echo "Only runtime observation/output files changed; parent pointer stays unchanged."
            echo "update=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          printf 'Meaningful engine changes:\n%s\n' "$meaningful"
          git -C X-Bunseki checkout --detach "$latest"
          echo "update=true" >> "$GITHUB_OUTPUT"
          echo "sha=$latest" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.engine.outputs.update == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install parent dependencies
        if: steps.engine.outputs.update == 'true'
        run: npm ci

      - name: Validate parent with updated engine
        if: steps.engine.outputs.update == 'true'
        run: |
          npm test
          npm run lint
          npm run build

      - name: Commit updated submodule pointer
        if: steps.engine.outputs.update == 'true'
        shell: bash
        env:
          ENGINE_SHA: ${{ steps.engine.outputs.sha }}
        run: |
          set -euo pipefail
          git config user.name "x-engine-sync[bot]"
          git config user.email "x-engine-sync[bot]@users.noreply.github.com"
          git add X-Bunseki
          git diff --cached --quiet && exit 0
          git commit -m "chore(x-engine): sync X-Bunseki $ENGINE_SHA"

          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "Failed to push updated submodule pointer after retries" >&2
          exit 1
