name: Sync X-Bunseki Submodule

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-x-bunseki-submodule
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Detect meaningful X-Bunseki changes
        id: engine
        shell: bash
        run: |
          set -euo pipefail
          current="$(git -C X-Bunseki rev-parse HEAD)"
          git -C X-Bunseki fetch --quiet origin main
          latest="$(git -C X-Bunseki rev-parse origin/main)"

          echo "current=$current"
          echo "latest=$latest"

          if [ "$current" = "$latest" ]; then
            echo "update=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed="$(git -C X-Bunseki diff --name-only "$current" "$latest" || true)"
          printf '%s\n' "$changed"

          meaningful="$(printf '%s\n' "$changed" | grep -Ev '^(hits\.(json|md)|status\.json|docs/(hits\.(json|md)|status\.json)|data/log/|data/notify_state\.json|data/training_snapshots\.jsonl|data/training_outcomes\.json|data/watchlist\.json)$' || true)"
          if [ -z "$meaningful" ]; then
            echo "Only runtime observation/output files changed; parent pointer stays unchanged."
            echo "update=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          printf 'Meaningful engine changes:\n%s\n' "$meaningful"
          git -C X-Bunseki checkout --detach "$latest"
          echo "update=true" >> "$GITHUB_OUTPUT"
          echo "sha=$latest" >> "$GITHUB_OUTPUT"

      - name: Commit updated submodule pointer
        if: steps.engine.outputs.update == 'true'
        shell: bash
        env:
          ENGINE_SHA: ${{ steps.engine.outputs.sha }}
        run: |
          set -euo pipefail
          git config user.name "x-engine-sync[bot]"
          git config user.email "x-engine-sync[bot]@users.noreply.github.com"
          git add X-Bunseki
          git diff --cached --quiet && exit 0
          git commit -m "chore(x-engine): sync X-Bunseki $ENGINE_SHA"

          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "Failed to push updated submodule pointer after retries" >&2
          exit 1
